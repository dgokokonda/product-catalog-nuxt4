<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Перенаправление…</title>
    <script type="text/javascript">
      (function () {
        // Base URL приложения на GitHub Pages (должен совпадать с app.baseURL
        // в nuxt.config.ts и NUXT_APP_BASE_URL в GitHub Actions).
        var base = "/product-catalog-nuxt4/";
        var path = window.location.pathname;

        if (path.indexOf(base) === 0) {
          var rest = path.slice(base.length).replace(/^\/+/, "");
          if (rest) {
            // Сохраняем маршрут, чтобы Nuxt открыл его после загрузки index.html
            sessionStorage.setItem("__nuxt_path", "/" + rest);
          }
          window.location.replace(base + "index.html");
        } else {
          window.location.replace(base + "index.html");
        }
      })();
    </script>
  </head>
  <body></body>
</html>
